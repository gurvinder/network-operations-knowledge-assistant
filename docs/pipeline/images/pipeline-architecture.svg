<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 755" font-family="Inter, -apple-system, sans-serif" font-size="12">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a5568"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2b6cb0"/>
    </marker>
    <marker id="arrowhead-purple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#805ad5"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e53e3e"/>
    </marker>
    <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#718096"/>
    </marker>
  </defs>

  <rect width="1100" height="755" fill="#f7fafc" rx="8"/>

  <!-- Title -->
  <text x="550" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Network Operations Knowledge Assistant - Pipeline Architecture</text>

  <!-- ===== DATA LAYER ===== -->
  <rect x="30" y="42" width="1040" height="185" rx="8" fill="#ebf8ff" stroke="#3182ce" stroke-width="2"/>
  <text x="50" y="60" font-size="12" font-weight="bold" fill="#2c5282">DATA LAYER</text>
  <text x="170" y="60" font-size="9" fill="#4a5568">Documents processed once, consumed by both FT and Inference layers</text>

  <!-- Document Sources -->
  <rect x="45" y="72" width="230" height="68" rx="5" fill="white" stroke="#bee3f8" stroke-width="1.5"/>
  <text x="160" y="87" text-anchor="middle" font-size="9" font-weight="bold" fill="#2c5282">DOCUMENT SOURCES</text>
  <rect x="52" y="95" width="105" height="36" rx="3" fill="#f7fafc" stroke="#bee3f8" stroke-width="1"/>
  <text x="104" y="110" text-anchor="middle" font-size="8" font-weight="600" fill="#2d3748">GSMA Datasets</text>
  <text x="104" y="122" text-anchor="middle" font-size="7" fill="#718096">3GPP, ETSI, O-RAN, ITU</text>
  <rect x="163" y="95" width="105" height="36" rx="3" fill="#f7fafc" stroke="#bee3f8" stroke-width="1"/>
  <text x="215" y="110" text-anchor="middle" font-size="8" font-weight="600" fill="#2d3748">Proprietary Docs</text>
  <text x="215" y="122" text-anchor="middle" font-size="7" fill="#718096">Runbooks, Vendor Manuals</text>

  <!-- Docling -->
  <rect x="310" y="72" width="170" height="68" rx="5" fill="white" stroke="#38a169" stroke-width="1.5"/>
  <text x="395" y="87" text-anchor="middle" font-size="9" font-weight="bold" fill="#276749">Docling</text>
  <text x="395" y="100" text-anchor="middle" font-size="8" fill="#718096">DocumentConverter</text>
  <rect x="318" y="106" width="70" height="26" rx="3" fill="#f0fff4" stroke="#c6f6d5" stroke-width="1"/>
  <text x="353" y="118" text-anchor="middle" font-size="7" fill="#2d3748">Hierarchical</text>
  <text x="353" y="127" text-anchor="middle" font-size="7" fill="#2d3748">Chunker</text>
  <rect x="395" y="106" width="70" height="26" rx="3" fill="#f0fff4" stroke="#c6f6d5" stroke-width="1"/>
  <text x="430" y="118" text-anchor="middle" font-size="7" fill="#2d3748">Hybrid</text>
  <text x="430" y="127" text-anchor="middle" font-size="7" fill="#2d3748">Chunker</text>

  <!-- Arrow: Sources to Docling -->
  <line x1="275" y1="106" x2="310" y2="106" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Structured Datasets -->
  <rect x="520" y="72" width="210" height="45" rx="5" fill="white" stroke="#805ad5" stroke-width="1.5"/>
  <text x="625" y="88" text-anchor="middle" font-size="9" font-weight="bold" fill="#553c9a">Structured Datasets (S3)</text>
  <text x="625" y="101" text-anchor="middle" font-size="8" fill="#718096">MD + outlines + domain labels</text>
  <text x="625" y="112" text-anchor="middle" font-size="7" fill="#718096">Feeds FT Layer</text>

  <!-- Embeddings -->
  <rect x="520" y="124" width="210" height="45" rx="5" fill="white" stroke="#e53e3e" stroke-width="1.5"/>
  <text x="625" y="140" text-anchor="middle" font-size="9" font-weight="bold" fill="#9b2c2c">Embeddings (PGVector)</text>
  <text x="625" y="153" text-anchor="middle" font-size="8" fill="#718096">GSMA OTel embedding models</text>
  <text x="625" y="164" text-anchor="middle" font-size="7" fill="#718096">Feeds Inference Layer</text>

  <!-- Arrow: Docling to Datasets -->
  <line x1="480" y1="93" x2="520" y2="93" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Arrow: Docling to Embeddings -->
  <path d="M 480 125 L 500 125 L 500 146 L 520 146" fill="none" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- GSMA Embedding model -->
  <rect x="770" y="124" width="280" height="45" rx="5" fill="#fffbeb" stroke="#d69e2e" stroke-width="1.5"/>
  <text x="910" y="140" text-anchor="middle" font-size="9" font-weight="bold" fill="#744210">GSMA OTel Embeddings</text>
  <text x="910" y="153" text-anchor="middle" font-size="8" fill="#975a16">Telecom-domain optimized | 22M-8B params | vLLM</text>

  <!-- Arrow: GSMA to PGVector -->
  <line x1="770" y1="146" x2="730" y2="146" stroke="#718096" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowhead-dashed)"/>

  <!-- Shared Storage -->
  <rect x="45" y="180" width="1005" height="35" rx="4" fill="white" stroke="#bee3f8" stroke-width="1"/>
  <text x="550" y="196" text-anchor="middle" font-size="9" font-weight="bold" fill="#2c5282">Shared Storage</text>
  <text x="550" y="208" text-anchor="middle" font-size="8" fill="#718096">MinIO (S3) for datasets + checkpoints | PGVector for embeddings | HuggingFace for GSMA datasets</text>

  <!-- ===== Data to FT arrow ===== -->
  <path d="M 200 227 L 200 260" fill="none" stroke="#805ad5" stroke-width="2" marker-end="url(#arrowhead-purple)"/>
  <rect x="130" y="232" width="120" height="15" rx="3" fill="#faf5ff" stroke="none"/>
  <text x="190" y="243" text-anchor="middle" font-size="8" font-weight="bold" fill="#805ad5">structured datasets</text>

  <!-- ===== FINE-TUNING LAYER ===== -->
  <rect x="30" y="255" width="400" height="230" rx="8" fill="#faf5ff" stroke="#805ad5" stroke-width="2"/>
  <text x="50" y="273" font-size="12" font-weight="bold" fill="#553c9a">FINE-TUNING LAYER</text>
  <text x="210" y="273" font-size="9" fill="#4a5568">Consumes Data Layer datasets</text>

  <!-- SDG Hub -->
  <rect x="50" y="283" width="360" height="55" rx="5" fill="white" stroke="#e9d8fd" stroke-width="1.5"/>
  <text x="230" y="298" text-anchor="middle" font-size="9" font-weight="bold" fill="#553c9a">SDG Hub - Knowledge Tuning Flows</text>
  <text x="230" y="311" text-anchor="middle" font-size="8" fill="#718096">Direct from Docling structured output</text>
  <rect x="58" y="318" width="160" height="14" rx="2" fill="#fffbeb" stroke="#d69e2e" stroke-width="1"/>
  <text x="138" y="329" text-anchor="middle" font-size="7" fill="#744210">vLLM Teacher (gpt-oss-120b)</text>
  <rect x="226" y="318" width="175" height="14" rx="2" fill="#faf5ff" stroke="#e9d8fd" stroke-width="1"/>
  <text x="313" y="329" text-anchor="middle" font-size="7" fill="#553c9a">~2,000 synthetic Q&amp;A pairs (JSONL)</text>

  <!-- Arrow: SDG to Training -->
  <line x1="230" y1="338" x2="230" y2="352" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Training Hub -->
  <rect x="50" y="355" width="360" height="42" rx="5" fill="white" stroke="#e53e3e" stroke-width="1.5"/>
  <text x="230" y="372" text-anchor="middle" font-size="9" font-weight="bold" fill="#9b2c2c">Training Hub (OSFT) + Kubeflow Trainer v2</text>
  <text x="230" y="385" text-anchor="middle" font-size="8" fill="#718096">GPT OSS 20B student</text>

  <!-- Arrow: Training to Eval -->
  <line x1="230" y1="397" x2="230" y2="411" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Eval + Registry -->
  <rect x="50" y="414" width="170" height="42" rx="5" fill="white" stroke="#d69e2e" stroke-width="1.5"/>
  <text x="135" y="432" text-anchor="middle" font-size="9" font-weight="bold" fill="#744210">Eval Hub</text>
  <text x="135" y="447" text-anchor="middle" font-size="8" fill="#718096">Base vs OSFT vs OSFT+RAG</text>

  <rect x="240" y="414" width="170" height="42" rx="5" fill="white" stroke="#3182ce" stroke-width="1.5"/>
  <text x="325" y="432" text-anchor="middle" font-size="9" font-weight="bold" fill="#2c5282">Registry + Deploy</text>
  <text x="325" y="447" text-anchor="middle" font-size="8" fill="#718096">RHOAI Registry | KServe + vLLM</text>

  <!-- Arrow: Eval to Registry -->
  <line x1="220" y1="435" x2="240" y2="435" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Kubeflow wrapper -->
  <rect x="40" y="278" width="380" height="185" rx="5" fill="none" stroke="#a0aec0" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="415" y="290" text-anchor="end" font-size="7" font-weight="bold" fill="#718096">Kubeflow Pipelines</text>

  <!-- ===== INTER-LAYER ARROWS ===== -->

  <!-- FT to Inference (deploy model) -->
  <path d="M 325 456 L 325 510 L 745 510 L 745 530" fill="none" stroke="#3182ce" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
  <rect x="475" y="502" width="85" height="14" rx="3" fill="#f7fafc" stroke="none"/>
  <text x="517" y="512" text-anchor="middle" font-size="8" fill="#3182ce">deploy model</text>

  <!-- Data to Inference (embeddings) -->
  <path d="M 625 169 L 625 227 L 450 227 L 450 510 L 130 510 L 130 530" fill="none" stroke="#e53e3e" stroke-width="2" marker-end="url(#arrowhead-red)"/>
  <rect x="213" y="502" width="72" height="14" rx="3" fill="#f7fafc" stroke="none"/>
  <text x="249" y="512" text-anchor="middle" font-size="8" fill="#9b2c2c">embeddings</text>

  <!-- ===== INFERENCE LAYER ===== -->
  <rect x="30" y="500" width="1040" height="165" rx="8" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="50" y="520" font-size="12" font-weight="bold" fill="#9b2c2c">INFERENCE LAYER</text>
  <text x="200" y="520" font-size="9" fill="#4a5568">Consumes Data Layer embeddings + FT Layer model</text>
  <text x="1055" y="520" text-anchor="end" font-size="7" fill="#9b2c2c">rh-ai-quickstart/ai-architecture-charts</text>

  <!-- PGVector -->
  <rect x="50" y="535" width="155" height="42" rx="5" fill="white" stroke="#fed7d7" stroke-width="1.5"/>
  <text x="127" y="553" text-anchor="middle" font-size="9" font-weight="bold" fill="#2d3748">PGVector</text>
  <text x="127" y="566" text-anchor="middle" font-size="8" fill="#718096">Data Layer embeddings</text>

  <!-- OGX -->
  <rect x="240" y="535" width="300" height="42" rx="5" fill="white" stroke="#fed7d7" stroke-width="1.5"/>
  <text x="390" y="553" text-anchor="middle" font-size="9" font-weight="bold" fill="#2d3748">OGX / Llama Stack (RAG Orchestration)</text>
  <text x="390" y="566" text-anchor="middle" font-size="8" fill="#718096">Query -&gt; Retrieve -&gt; Augment -&gt; Generate</text>

  <!-- KServe + vLLM -->
  <rect x="575" y="535" width="290" height="42" rx="5" fill="#fffbeb" stroke="#d69e2e" stroke-width="1.5"/>
  <text x="720" y="553" text-anchor="middle" font-size="9" font-weight="bold" fill="#744210">KServe + vLLM (GPT OSS 20B fine-tuned)</text>
  <text x="720" y="566" text-anchor="middle" font-size="8" fill="#975a16">Direct queries + RAG-augmented generation</text>

  <!-- Arrow: PGVector to OGX -->
  <line x1="205" y1="556" x2="240" y2="556" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Arrow: OGX to vLLM -->
  <line x1="540" y1="556" x2="575" y2="556" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Demo -->
  <rect x="50" y="593" width="815" height="38" rx="5" fill="white" stroke="#38a169" stroke-width="1.5"/>
  <text x="70" y="614" font-size="9" font-weight="bold" fill="#276749">NOC Assistant</text>
  <text x="155" y="614" font-size="10" font-weight="bold" fill="#276749">RHOAI Gen AI Studio</text>
  <text x="850" y="614" text-anchor="end" font-size="7" fill="#276749">playground chart</text>
  <text x="460" y="626" text-anchor="middle" font-size="8" fill="#718096">Chat UI + Source Citations + Vector Store Integration</text>

  <!-- Arrow: vLLM to Demo -->
  <line x1="720" y1="577" x2="720" y2="593" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- ===== INFRASTRUCTURE ===== -->
  <rect x="30" y="690" width="1040" height="55" rx="6" fill="#edf2f7" stroke="#a0aec0" stroke-width="1"/>
  <text x="55" y="708" font-size="10" font-weight="bold" fill="#4a5568">SHARED INFRASTRUCTURE</text>
  <rect x="50" y="716" width="100" height="22" rx="3" fill="white" stroke="#cbd5e0" stroke-width="1"/>
  <text x="100" y="731" text-anchor="middle" font-size="8" fill="#2d3748">OpenShift + RHOAI</text>
  <rect x="158" y="716" width="115" height="22" rx="3" fill="white" stroke="#cbd5e0" stroke-width="1"/>
  <text x="215" y="731" text-anchor="middle" font-size="7" fill="#2d3748">GPU Operator</text>
  <rect x="281" y="716" width="70" height="22" rx="3" fill="white" stroke="#cbd5e0" stroke-width="1"/>
  <text x="316" y="731" text-anchor="middle" font-size="8" fill="#2d3748">MinIO / S3</text>
  <rect x="359" y="716" width="105" height="22" rx="3" fill="white" stroke="#cbd5e0" stroke-width="1"/>
  <text x="411" y="731" text-anchor="middle" font-size="8" fill="#2d3748">Kubeflow Pipelines</text>
  <rect x="472" y="716" width="80" height="22" rx="3" fill="white" stroke="#cbd5e0" stroke-width="1"/>
  <text x="512" y="731" text-anchor="middle" font-size="8" fill="#2d3748">PGVector</text>
  <rect x="560" y="716" width="72" height="22" rx="3" fill="white" stroke="#cbd5e0" stroke-width="1"/>
  <text x="596" y="731" text-anchor="middle" font-size="8" fill="#2d3748">HF Token</text>
  <rect x="640" y="716" width="85" height="22" rx="3" fill="white" stroke="#cbd5e0" stroke-width="1"/>
  <text x="682" y="731" text-anchor="middle" font-size="8" fill="#2d3748">Helm Charts</text>

  <!-- Legend -->
  <rect x="470" y="255" width="310" height="110" rx="5" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="490" y="273" font-size="10" font-weight="bold" fill="#2d3748">Layers</text>
  <rect x="490" y="280" width="12" height="12" rx="2" fill="#ebf8ff" stroke="#3182ce" stroke-width="1.5"/>
  <text x="508" y="291" font-size="9" fill="#2d3748">Data: parse, chunk, embed (shared)</text>
  <rect x="490" y="298" width="12" height="12" rx="2" fill="#faf5ff" stroke="#805ad5" stroke-width="1.5"/>
  <text x="508" y="309" font-size="9" fill="#2d3748">Fine-Tuning: SDG, OSFT, eval, registry</text>
  <rect x="490" y="316" width="12" height="12" rx="2" fill="#fff5f5" stroke="#e53e3e" stroke-width="1.5"/>
  <text x="508" y="327" font-size="9" fill="#2d3748">Inference: RAG retrieval + serving</text>
  <rect x="490" y="334" width="12" height="12" rx="2" fill="#fffbeb" stroke="#d69e2e" stroke-width="1.5"/>
  <text x="508" y="345" font-size="9" fill="#2d3748">LLM models (teacher / student / embed)</text>
</svg>
